name: Verify Swift Code

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  validate:
    name: Lint and Compile Swift Files
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          swift --version

      - name: Compile Modules
        run: |
          # Compiles all Swift logic files directly into an active module to test for syntax and logic bugs
          swiftc -sdk $(xcrun --sdk iphonesimulator --show-sdk-path) \
                 -target x86_64-apple-ios17.0-simulator \
                 CollectorApp.swift ContentView.swift SortingEngine.swift PrinterManager.swift
